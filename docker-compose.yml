services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fireball
      POSTGRES_PASSWORD: fireball
      POSTGRES_DB: fireball
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireball"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped